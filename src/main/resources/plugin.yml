name: FlipMoneyFormat
version: '1.1.0'
main: dev.flip.moneyformat.FlipMoneyFormatPlugin
api-version: '1.21'
author: jrt94660-cyber
description: Compact Vault money formatting with PlaceholderAPI support.
website: https://github.com/jrt94660-cyber/FlipMoneyFormat
depend: [Vault]
softdepend: [PlaceholderAPI]
commands:
  flipmoneyformat:
    description: Reload FlipMoneyFormat settings.
    usage: /flipmoneyformat reload
    aliases: [fmf]
permissions:
  flipmoneyformat.admin:
    description: Allows reloading FlipMoneyFormat.
    default: op
