# FlipMoneyFormat configuration
# Reload changes with /flipmoneyformat reload

# When enabled, Vault plugins which call Economy#format(double) will use this format.
# All balance/deposit/withdraw methods are still forwarded to your real economy plugin.
vault-format-override: true

format:
  # Put your currency symbol here. Use an empty string for no symbol.
  symbol: '$'
  # true -> "$ 12.01K"; false -> "$12.01K"
  space-after-symbol: true
  # Number of digits after the decimal for abbreviated numbers and regular balances.
  decimal-places: 2
  # 100.00 becomes 100; 100.50 becomes 100.5 when enabled.
  trim-trailing-zeros: true
  # Amounts >= 1000 use suffixes. This only affects display, not actual balances.
  abbreviate: true
  # Convert configured suffixes to uppercase. This also upgrades old lowercase configs automatically.
  uppercase-suffixes: true
  # Suffixes in ascending powers of 1,000: thousand, million, billion, trillion, etc.
  suffixes: [K, M, B, T, Q, QQ]
  # These apply to full values and any displayed values below 1,000.
  grouping-separator: ','
  decimal-separator: '.'